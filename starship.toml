format = "$directory$git_branch$git_status $character"

[character]
success_symbol = "[>](green)"
error_symbol = "[>](red)"

[directory]
style = "cyan bold"
truncation_length = 1
truncate_to_repo = true
format = "[$path]($style)"

[git_branch]
symbol = ""
style = "purple"
format = "| [$branch]($style)"

[git_status]
style = "yellow"
ahead = "⇡${count}"
behind = "⇣${count}"
modified = "!${count}"
untracked = "?${count}"
staged = "+${count}"
format = "[$all_status]($style)"
